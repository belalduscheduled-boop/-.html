:root[data-theme="dark"]{--bg:#0e1320;--card:#171f31;--tx:#e8edf8;--mu:#93a1bf;--bd:#26314a;--pr:#6c97ff;--ok:#4ade80;--okb:#12351f;--bad:#f87171;--badb:#3b1818}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;background:var(--img) center/cover;opacity:.12;z-index:-1}
header{position:relative;color:#fff;min-height:250px;display:flex;align-items:flex-end;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(13,148,136,.72) 100%),var(--img) center 22%/cover;border-radius:0 0 28px 28px;margin-bottom:6px}
header div{padding:20px 20px 22px;max-width:720px;margin:auto;width:100%}
header small{opacity:.85;font-size:12px;letter-spacing:.5px}
header h1{margin:2px 0 8px;font-size:25px}
header p{margin:0;font-size:15px;font-weight:600;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);padding:9px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.22)}
.fb{margin:2px 4px 10px;font-weight:700;text-align:center}.fb.g{color:var(--ok)}.fb.r{color:var(--bad)}
.nv{display:flex;gap:10px;align-items:stretch}.nv .main{margin:0;flex:1}.nv .ghost{padding:12px 16px;font-size:15px}.nv .ghost:disabled{opacity:.35}
main{max-width:720px;margin:auto;padding:10px 14px 110px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 14px}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center;font-size:13px;color:var(--mu)}
.stats b{display:block;font-size:22px;color:var(--tx)}
.day{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.day.today{border-color:var(--pr);box-shadow:0 0 0 2px color-mix(in srgb,var(--pr) 25%,transparent)}
.day h3{margin:0 0 10px;font-size:16px;display:flex;gap:8px;align-items:center}
.day small{color:var(--mu);font-weight:400}.day em{background:var(--pr);color:#fff;font-style:normal;font-size:11px;padding:2px 9px;border-radius:99px;margin-inline-start:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qc{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:14px;padding:12px;font:inherit;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:start}
.qc span{font-weight:700}.qc b{font-size:13px;color:var(--mu)}
.qc.done{background:var(--okb);border-color:var(--ok)}.qc.done b{color:var(--ok);font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
.card.sm h3{font-size:15px;margin:8px 0}.card.center{text-align:center}
.chip{display:inline-block;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.tp{display:block;color:var(--mu);font-size:12px;margin-top:6px;direction:ltr;text-align:left}
.card h2{font-size:18px;line-height:1.5;margin:10px 0 14px;text-align:left;font-weight:600}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;padding:11px 12px;margin-bottom:8px;font:inherit;cursor:pointer;direction:ltr}
.opt b{min-width:24px;height:24px;border-radius:50%;background:var(--card);border:1px solid var(--bd);display:grid;place-items:center;font-size:12px;flex:none}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.bad{background:var(--badb);border-color:var(--bad)}
.main{width:100%;background:var(--pr);color:#fff;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;margin:4px 0 10px;cursor:pointer}
.ghost{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.wide{width:100%;padding:12px}
.top{display:flex;align-items:center;gap:10px;margin:6px 0 14px;font-size:13px;color:var(--mu)}
.bar{flex:1;height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.ring{width:110px;height:110px;margin:6px auto 10px;border-radius:50%;border:8px solid var(--pr);display:grid;place-items:center;font-size:28px;font-weight:800}
.fl{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.fl button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}.fl .on{background:var(--pr);color:#fff;border-color:var(--pr)}
.x,.v{margin:4px 0;font-size:14px;text-align:left}.x{color:var(--bad)}.v{color:var(--ok)}.empty{text-align:center;color:var(--mu);padding:40px 10px}
nav{position:fixed;inset:auto 0 0 0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 0;font:inherit;font-size:14px;cursor:pointer}nav .on{color:var(--pr);font-weight:700}
nav i{font-style:normal;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:11px;margin-inline-start:4px}
</style>
</head>

const START=new Date(2026,10,1);
const SUBJ={Anatomy:['#2563eb','تشريح'],Pathology:['#9333ea','باثولوجي'],Physiology:['#16a34a','فسيولوجي'],Histology:['#d97706','هستولوجي'],Pharmacology:['#dc2626','فارماكولوجي']};
const AR=['الأحد','الاتنين','التلات','الأربع','الخميس','الجمعة','السبت'];
const app=document.getElementById('app');
let S={res:{},miss:{}},tab='plan',run=null,filt='all',first=true;
try{S=Object.assign(S,JSON.parse(localStorage.getItem('rq1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('rq1',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chip=s=>`<span class="chip" style="--c:${SUBJ[s][0]}">${SUBJ[s][1]}</span>`;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function render(){
  document.getElementById('nav').hidden=!!run;document.querySelector('header').hidden=!!run;
  if(run)return quiz();
  document.getElementById('nav').innerHTML=`<button class="${tab==='plan'?'on':''}" onclick="tab='plan';render()">📅 الخطة</button><button class="${tab==='mist'?'on':''}" onclick="tab='mist';render()">❌ الأخطاء<i>${Object.keys(S.miss).length}</i></button>`;
  tab==='plan'?plan():mist();
}
function plan(){
  const n=D.quizzes.length,rs=Object.values(S.res),avg=rs.length?Math.round(rs.reduce((a,r)=>a+r.s/r.t,0)/rs.length*100):0;
  const td=new Date();td.setHours(0,0,0,0);
  let h=`<div class="stats"><div><b>${rs.length}/${n}</b>كويز</div><div><b>${avg}%</b>المتوسط</div><div><b>${Object.keys(S.miss).length}</b>أخطاء</div></div>`;
  for(let d=0;d<n/2;d++){
    const dt=new Date(START);dt.setDate(dt.getDate()+d);
    const today=dt.getTime()===td.getTime();
    h+=`<section class="day${today?' today':''}"><h3>${AR[dt.getDay()]} <small>${dt.getDate()}/${dt.getMonth()+1}</small>${today?'<em>النهارده</em>':''}</h3><div class="row">`;
    for(let j=0;j<2;j++){const i=d*2+j,r=S.res[i];h+=`<button class="qc${r?' done':''}" onclick="go(${i})"><span>كويز ${i+1}${i>13?" ⭐":""}</span><b>${r?r.s+' / '+r.t:D.quizzes[i].length+' سؤال'}</b></button>`}
    h+='</div></section>';
  }
  app.innerHTML=h;
  if(first){first=false;const t=document.querySelector('.today');if(t)t.scrollIntoView({block:'center'})}
}
function go(i){run={ids:D.quizzes[i],i,pos:0,got:[],mode:'q'};window.scrollTo(0,0);render()}
function retry(){const ids=shuf(Object.keys(S.miss).filter(id=>D.Q[id]&&(filt==='all'||D.Q[id].s===filt)));if(!ids.length)return;run={ids,i:'m',pos:0,got:[],mode:'m'};window.scrollTo(0,0);render()}
function quiz(){
  const r=run;if(r.pos>=r.ids.length)return fin();
  const q=D.Q[r.ids[r.pos]],a=r.got[r.pos];
  let h=`<div class="top"><button class="ghost" onclick="quit()">✕</button><div class="bar"><i style="width:${r.pos/r.ids.length*100}%"></i></div><span>${r.pos+1}/${r.ids.length}</span></div><article class="card">${chip(q.s)}<small class="tp">${esc(q.t)}${q.h?' · '+esc(q.h):''}</small><h2 dir="auto">${esc(q.q)}</h2>`;
  q.o.forEach((o,k)=>{let c='opt';if(a!==undefined){if(k===q.a)c+=' ok';else if(k===a)c+=' bad'}h+=`<button class="${c}" onclick="pick(${k})"><b>${'ABCDE'[k]}</b><span>${esc(o)}</span></button>`});
  h+='</article>';
  if(a!==undefined){const ok=a===q.a,L=ok?CH:BD;h+=`<p class="fb ${ok?'g':'r'}">${L[r.pos%L.length]}</p>`}
  h+=`<div class="nv"><button class="ghost" onclick="prv()" ${r.pos?'':'disabled'}>→ السابق</button><button class="main" onclick="nxt()">${r.pos+1<r.ids.length?'التالي ←':'النتيجة'}</button></div>`;
  app.innerHTML=h;
}
function pick(k){
  const r=run;if(r.got[r.pos]!==undefined)return;
  r.got[r.pos]=k;const id=r.ids[r.pos],q=D.Q[id];
  if(k!==q.a){const m=S.miss[id]||{n:0};S.miss[id]={w:k,n:m.n+1}}else if(r.mode==='m')delete S.miss[id];
  save();quiz();
}
function nxt(){run.pos++;window.scrollTo(0,0);quiz()}
function prv(){if(run.pos>0){run.pos--;window.scrollTo(0,0);quiz()}}
function fin(){
  const r=run,t=r.ids.length,s=r.ids.filter((id,p)=>r.got[p]===D.Q[id].a).length,w=r.got.filter((g,p)=>g!==undefined&&g!==D.Q[r.ids[p]].a).length,u=t-s-w;
  if(r.mode==='q'){S.res[r.i]={s,t};save()}
  const msg=r.mode==='m'?(s?s+' اتحلّوا واتشالوا من الأخطاء':'لسه محتاجين مراجعة'):(w?w+' سؤال غلط اتضافوا لقسم الأخطاء':'ولا غلطة! 🔥')+(u?' · '+u+' من غير إجابة':'');
  app.innerHTML=`<div class="card center"><div class="ring">${Math.round(s/t*100)}%</div><h2 style="text-align:center">${s} / ${t}</h2><p>${msg}</p><p class="fb g">${s/t>=.8?'مستوى جامد! كمّل كده يا دكتور 🏆':s/t>=.5?'كويس، شوية مراجعة للأخطاء وهتبقى نار 🔥':'البداية دايمًا أصعب حاجة، المهم إنك مكمّل 💪'}</p><button class="main" onclick="quit()">رجوع للخطة</button>${w&&r.mode==='q'?'<button class="ghost wide" onclick="quit(\'mist\')">شوف الأخطاء</button>':''}</div>`;
}
function quit(t){run=null;if(t)tab=t;window.scrollTo(0,0);render()}
function rm(id){delete S.miss[id];save();render()}
function mist(){
  const ids=Object.keys(S.miss).filter(id=>D.Q[id]&&(filt==='all'||D.Q[id].s===filt));
  let h='<div class="fl">'+['all',...Object.keys(SUBJ)].map(s=>`<button class="${filt===s?'on':''}" onclick="filt='${s}';render()">${s==='all'?'الكل':SUBJ[s][1]}</button>`).join('')+'</div>';
  if(!ids.length)h+='<p class="empty">مفيش أخطاء هنا 🎉<br>أي سؤال هتغلط فيه هيتجمع في المكان ده.</p>';
  else{
    h+=`<button class="main" onclick="retry()">اختبر نفسك في ${ids.length} سؤال غلط</button>`;
    ids.forEach(id=>{const q=D.Q[id],m=S.miss[id];h+=`<article class="card sm">${chip(q.s)}<small class="tp">${esc(q.t)}</small><h3 dir="auto" style="text-align:left">${esc(q.q)}</h3><p class="x" dir="auto">✗ ${esc(q.o[m.w])}</p><p class="v" dir="auto">✓ ${esc(q.o[q.a])}</p><button class="ghost" onclick="rm('${id}')">شيلها</button></article>`});
  }
  app.innerHTML=h;
}
const QUOTES=['النهارده تعب، وبكرة دكتور 🩺','كل سؤال بتحله بيقربك خطوة من اللقب','قارن نفسك بنفسك إمبارح، مش بحد تاني','الغلطة النهارده هي الإجابة الصح يوم الامتحان','الاستمرارية أهم من الحماس، كمّل!','إنت أقرب مما تتخيل، متقفش دلوقتي','اللي بيتعب دلوقتي هيعالج ناس كتير بعدين ❤️'];
const CH=['عاش يا دكتور! 🔥','تمام كده 👏','ممتاز، كمّل 💪','إنت ماشي صح ⭐'],BD=['ولا يهمك، اتسجلت في الأخطاء وهتكسبها المرة الجاية 💡','الغلطة دي هتفضل في دماغك للامتحان 😉','كل دكتور غلط هنا قبل ما يصيب 💪'];
document.getElementById('quote').textContent=QUOTES[Math.floor(Date.now()/864e5)%QUOTES.length];
render();
</script>
